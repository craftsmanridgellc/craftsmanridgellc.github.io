<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Craftsman Ridge Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    /* 1. Full Screen Reset */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f6f9; }
    
    /* 2. Splash Screen Styling */
    #splash { 
      display: flex; justify-content: center; align-items: center; 
      width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10;
    }
    .card { 
      background: white; padding: 40px; border-radius: 16px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 90%; max-width: 400px; 
      text-align: center; border: 1px solid #eef0f2; 
    }
    .logo { width: 180px; margin-bottom: 25px; }
    h2 { color: #1e293b; font-size: 20px; margin-bottom: 10px; font-weight: 800; }
    p { color: #64748b; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
    .btn { 
      background: #1a73e8; color: white; border: none; padding: 15px 30px; 
      border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; 
      width: 100%; transition: 0.2s; text-decoration: none; display: block; 
    }

    /* 3. The Iframe (The App) */
    #portal-container { width: 100%; height: 100%; display: none; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- STEP 1: The Professional Entrance -->
  <div id="splash">
    <div class="card">
      <img src="https://drive.google.com/thumbnail?id=1GM68ea7igcRbNx757QrJbD2hTsE91g--&sz=w500" class="logo">
      <h2 id="title">Welcome</h2>
      <p id="msg">Securely accessing the Craftsman Ridge client portal...</p>
      <button class="btn" onclick="loadApp()" id="btnText">Enter Portal</button>
    </div>
  </div>

  <!-- STEP 2: The App Container -->
  <div id="portal-container"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const page = params.get('page');

    // UI Customization
    if (page === 'schedule') {
      document.getElementById('title').innerText = "Schedule Site Visit";
      document.getElementById('btnText').innerText = "Open Scheduler";
    } else if (page === 'client_approve') {
      document.getElementById('title').innerText = "Review Proposal";
      document.getElementById('btnText').innerText = "View Document";
    }

    function loadApp() {
      const scriptBase = "https://script.google.com/macros/s/AKfycbwzv-S1knySASR2yJkoHuuN7OuzGnB9fLuiYDCczu4A_VFcC2HAAI20VPUhVRM9K-wg/exec";
      
      // We pass all original parameters + the gw=true flag to bypass the Google-side gateway
      params.set('gw', 'true');
      const finalUrl = scriptBase + "?" + params.toString();

      // Hide splash, show portal
      document.getElementById('splash').style.display = 'none';
      const container = document.getElementById('portal-container');
      container.style.display = 'block';
      
      // Inject the iframe
      container.innerHTML = `<iframe src="${finalUrl}" allow="geolocation; microphone; camera"></iframe>`;
    }
  </script>
</body>
</html>
