<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftsman Ridge Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Quicksand', sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 100%; max-width: 400px; text-align: center; border: 1px solid #eef0f2; }
    .logo { width: 180px; margin-bottom: 25px; }
    h2 { color: #1e293b; font-size: 20px; margin-bottom: 10px; font-weight: 800; }
    p { color: #64748b; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
    .btn { background: #1a73e8; color: white; border: none; padding: 15px 30px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; text-decoration: none; display: block; }
    .btn:hover { background: #1557b0; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://drive.google.com/thumbnail?id=1GM68ea7igcRbNx757QrJbD2hTsE91g--&sz=w500" class="logo">
    <h2 id="title">Welcome</h2>
    <p id="msg">Access the Craftsman Ridge secure client portal.</p>
    <a href="#" id="portalLink" class="btn">Enter Portal</a>
  </div>

  <script>
    // 1. Your Google Apps Script Public URL
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzv-S1knySASR2yJkoHuuN7OuzGnB9fLuiYDCczu4A_VFcC2HAAI20VPUhVRM9K-wg/exec";

    // 2. Parse incoming parameters from craftsmanridge.com
    const params = new URLSearchParams(window.location.search);
    const page = params.get('page');

    const titleEl = document.getElementById('title');
    const btnEl = document.getElementById('portalLink');

    // 3. Customize the UI based on the link clicked
    if (page === 'schedule') {
      titleEl.innerText = "Schedule Site Visit";
      btnEl.innerText = "Open Scheduler";
    } else if (page === 'client_approve') {
      titleEl.innerText = "Review Proposal";
      btnEl.innerText = "View Document";
    } else {
      titleEl.innerText = "Project Request";
      btnEl.innerText = "Start Request";
    }

    // 4. Build the final URL with the gw=true flag for the Apps Script
    params.set('gw', 'true');
    btnEl.href = APPS_SCRIPT_URL + "?" + params.toString();
  </script>
</body>
</html>
