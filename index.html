<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Craftsman Ridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f6f9; }
    iframe { width: 100%; height: 100%; border: none; }
    #placeholder { display: flex; justify-content: center; align-items: center; height: 100%; text-align: center; }
    .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); }
  </style>
</head>
<body onload="init()">

  <div id="app-container" style="width:100%; height:100%; display:none;"></div>

  <div id="placeholder" style="display:none;">
    <div class="card">
      <img src="https://drive.google.com/thumbnail?id=1GM68ea7igcRbNx757QrJbD2hTsE91g--&sz=w500" style="width:180px; margin-bottom:20px;">
      <h2 style="font-family:'Quicksand'; color:#1e293b;">Website Coming Soon</h2>
      <p style="font-family:'Quicksand'; color:#64748b;">Our new digital home is under construction.</p>
    </div>
  </div>

  <script>
function init() {
  const params = new URLSearchParams(window.location.search);
  const appContainer = document.getElementById('app-container');
  const placeholder = document.getElementById('placeholder');

  if (params.has('page')) {
    const scriptBase = "https://script.google.com/macros/s/AKfycbwzv-S1knySASR2yJkoHuuN7OuzGnB9fLuiYDCczu4A_VFcC2HAAI20VPUhVRM9K-wg/exec";
    
    // params.toString() includes 'page', 'id', 'dur', etc.
    const finalUrl = scriptBase + "?" + params.toString() + "&gw=true";
    
    appContainer.style.display = 'block';
    appContainer.innerHTML = `<iframe src="${finalUrl}" allow="geolocation; microphone; camera"></iframe>`;
  } else {
    placeholder.style.display = 'flex';
  }
}
  </script>
</body>
</html>
